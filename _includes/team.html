<!-- Team Section -->
    <section id="team" class="bg-light-gray">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Me, Myself, and I</h2>
                    <h3 class="section-subheading text-muted">So you really wanna know me huh?</h3>
                </div>
            </div>
            <div class="row">
                {% for member in site.people %}
                <div class="col-md-4 text-center">
                    <div class="team-member">
                        <img src="img/team/{{ member.pic }}.jpg" class="img-responsive img-circle" alt="">
                        <h4>{{ member.name }}</h4>
                        <p class="text-muted">{{ member.position }}</p>
                        <ul class="list-inline social-buttons">
                            {% for network in member.social %}
                            <li>
                                <a href="{{ network.url }}">
                                    <i class="fa fa-{{ network.title }}"></i>
                                </a>
                            </li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="speech-balloon">
                        <p>
                            {{ member.bio | default: "What happened to the bio here???" }}
                        </p>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>
