      #- title: "Creative Market"
        #url: https://github.com/raviriley/agency-jekyll-theme
        #logo: assets/img/clients/creative-market.jpg

  team:
    title: ":D"
    text: "So you really wanna know me huh?"
    subtext: After my studies, I was lucky enough to find a job in e-commerce, I was sent to Singapore for training and was hired as a product lister. I was tasked to create listings from scratch, from editing images to use as the main image to gathering all the necessary information to create a listing. I was also tasked to create promotional materials for campaigns, which involved creating banners and other graphics. I also created automation scripts to help with the listing process, which helped me to be more efficient and productive. After a while, I had tasks in upselling and A/B testing, which involved creating different versions of listings and testing them to see which one performed better. While I have my 9-5 job, I also work on some side projects in my free time, like managing a client's small pet supply business by onboarding products and synchronized Shopee orders with their Loyverse POS system, effectively bridging the gap between online and offline operations. <br><br> **I'm always looking for new opportunities to grow and learn.**
