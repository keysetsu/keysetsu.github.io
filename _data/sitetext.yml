en: &DEFAULT_EN
  header:
    title: From Game Development to E-Commerce Mastery
    text: Kenichi E. Yoshida
    button: Discover My Skills & Projects
    buttonlink: "#services"

  services:
    title: "Skills"
    text: "Kind of a weird mix, I know."
    section: services
    list:
      - title: "E-Commerce"
        desc: "Single Product or Bulk Uploads, Stock Management, Pricing Strategies, and Product Optimization for Campaigns."
        icon: fas fa-shopping-cart
      - title: "Game Development"
        desc: "2D and 3D Game Development using Unity and C#, with a focus on creating engaging and immersive experiences."
        icon: fas fa-gamepad
      - title: "Automation Scripting"
        desc: "Custom automation scripts to streamline workflows and improve efficiency."
        icon: fas fa-code

  portfolio:
    title: "Portfolio"
    text: "A selection of my work in e-commerce product listing and automation scripting."
    section: portfolio
    closebutton: "Close Project"

  timeline:
    title: "Timeline"
    text: "A not so long time ago..."
    section: timeline
    # left is the default
    #start_align: "left"
    events:
      - title: "I thought I was going to be a lawyer..."
        year: "2011-2015"
        desc: "I studies BS Psychology at San Beda College, that was supposed to be a pre-law course but I ended up not pursuing law and instead went into game development."
        image: assets/img/timeline/1.gif
        alt:
      - title: "If you love what you do, you'll never work a day in your life"
        year: "2015-2019"
        desc: "I took a course in game development and found that I really enjoyed it, I graduated Cum Laude and tried to find a job in the industry but couldn't find one, so I ended up doing freelance work and eventually found my way into e-commerce product listing and automation scripting."
        image: assets/img/timeline/2.gif
        alt:
      - title: "My first e-commerce job!"
        year: "2019-2026"
        desc: "Luckily, before the covid-19 pandemic hit, I was able to find a job in e-commerce product listing and automation scripting, and I've been doing it ever since. It's been a great experience and I've learned a lot along the way."
        image: assets/img/timeline/3.gif
        alt: image alt text
      - title: "Doing some side projects and looking for new opportunities"
        year: "Presently"
        desc: "While I was enjoying my work in e-commerce product listing, I used my free time to work on some side projects, and I'm always looking for new opportunities to grow and learn in the field."
        image: assets/img/timeline/4.gif
        alt:
        # you can enforce the alignment
        align: right
    end: "Allons-y! <br> Let's get to work!"

  #about:
    #title: "Me, Myself, and I"
    #text: "So you really wanna know me huh?"
    #body: "After my studies, I was lucky enough to find a job in e-commerce, I was sent to Singapore for training and was hired as a product lister. I was tasked to create listings from scratch, from editing images to use as the main image to gathering all the necessary information to create a listing. I was also tasked to create promotional materials for campaigns, which involved creating banners and other graphics. I also created automation scripts to help with the listing process, which helped me to be more efficient and productive. After a while, I had tasks in upselling and A/B testing, which involved creating different versions of listings and testing them to see which one performed better. Overall, it was a great experience and I learned a lot about e-commerce and automation scripting."
